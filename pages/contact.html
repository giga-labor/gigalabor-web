<!DOCTYPE html>
<html lang="it" data-theme="contrast">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <meta name="description" content="">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
  <style>
    .animate { opacity: 0; transform: translateY(24px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .animate.animated { opacity: 1; transform: translateY(0); }
    .contact-form { display: flex; flex-direction: column; gap: 1rem; }
    .form-group  { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label  { font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.04em; }
    .form-input, .form-textarea { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 1rem; color: var(--text-primary); font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-input:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-textarea { min-height: 160px; resize: vertical; }
    .form-feedback { display:none; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-top: 0.5rem; }
    .form-feedback--success { background: rgba(16,185,129,.12); color: var(--success); border: 1px solid rgba(16,185,129,.25); }
    .form-feedback--error   { background: rgba(239,68,68,.12); color: var(--danger); border: 1px solid rgba(239,68,68,.25); }
    .contact-layout { display: grid; grid-template-columns: 1fr 1.4fr; gap: 4rem; align-items: start; }
    @media (max-width: 900px) { .contact-layout { grid-template-columns: 1fr; } }
  </style>
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="GiGa Labor">
  <meta property="og:title"       content="Contatti — GiGa Labor">
  <meta property="og:description" content="Contatta GiGa Labor per collaborazioni, domande tecniche o segnalazioni.">
  <meta property="og:url"         content="https://gigalabor.it/pages/contact.html">
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Contatti — GiGa Labor">
  <meta name="twitter:description" content="Contatta GiGa Labor per collaborazioni, domande tecniche o segnalazioni.">
  <meta name="robots"              content="index, follow">
  <link rel="canonical"            href="https://gigalabor.it/pages/contact.html">
</head>
<body data-page="contact">
  <div id="page-loader"><div class="loader-logo"><span class="gi">Gi</span><span class="ga">Ga</span><span class="labor"> Labor</span></div></div>
  <div id="navbar-root"></div>

  <div class="page-hero">
    <div class="container">
      <a href="../index.html" class="back-link" data-i18n="ui.back"></a>
      <span class="section-label" data-i18n="sections.contact_title"></span>
      <h1 class="section-title" data-i18n="contact.headline"></h1>
      <p class="text-secondary mt-2" data-i18n="contact.subheadline"></p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="contact-layout">
        <div class="animate" style="display: flex; flex-direction: column; gap: 1rem;">
          <div class="info-card"><div class="info-card__icon">@</div><div><div class="info-card__label" data-i18n="contact.email_label"></div><div class="info-card__value"><a href="mailto:giga.labor2026@gmail.com" data-i18n="contact.email_address"></a></div></div></div>
          <div class="info-card"><div class="info-card__icon">WEB</div><div><div class="info-card__label" data-i18n="contact.project_site_label"></div><div class="info-card__value"><a href="https://gigalabor.it" target="_blank" rel="noopener">gigalabor.it</a></div></div></div>
          <div class="info-card"><div class="info-card__icon">IT</div><div><div class="info-card__label" data-i18n="contact.location_label"></div><div class="info-card__value" data-i18n="contact.location_value"></div></div></div>
          <div class="card mt-2" style="border-color: var(--accent); background: var(--accent-glow);"><p class="text-sm text-secondary"><span data-i18n="contact.public_note"></span> <a href="scritti.html" class="text-accent" data-i18n="nav.scritti"></a>.</p></div>
        </div>

        <div class="animate">
          <form class="contact-form" id="contact-form" novalidate>
            <div class="form-group"><label class="form-label" for="c-name" data-i18n="contact.name_label"></label><input class="form-input" type="text" id="c-name" name="name" data-i18n-attr="placeholder:contact.name_placeholder" required></div>
            <div class="form-group"><label class="form-label" for="c-email" data-i18n="contact.email_label"></label><input class="form-input" type="email" id="c-email" name="email" data-i18n-attr="placeholder:contact.email_placeholder"></div>
            <div class="form-group"><label class="form-label" for="c-message" data-i18n="contact.message_label"></label><textarea class="form-textarea" id="c-message" name="message" data-i18n-attr="placeholder:contact.message_placeholder" required></textarea></div>
            <button type="submit" class="btn btn--primary" data-i18n="contact.send_btn"></button>
            <div id="form-feedback" class="form-feedback"></div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-root"></div>
  <script src="../js/data/gl-data.js"></script>
  <script src="../js/data/i18n/it.js"></script>
  <script src="../js/data/i18n/en.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
