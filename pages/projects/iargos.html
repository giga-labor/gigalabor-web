  <style>
    :root { --project-color: #10b981; --project-glow: rgba(16,185,129,.18); }
    .animate { opacity:0; transform:translateY(24px); transition:opacity .5s ease,transform .5s ease; }
    .animate.animated { opacity:1; transform:translateY(0); }
    .project-accent { color: var(--project-color); }
    .project-hero { border-top: 3px solid var(--project-color); }

    .sec { padding: 3rem 0; border-top: 1px solid var(--border); }
    .sec:first-child { border-top: none; }
    .sec-label { font-family: 'JetBrains Mono',monospace; font-size:.7rem; font-weight:600;
                 letter-spacing:.12em; text-transform:uppercase; color:var(--project-color);
                 opacity:.75; margin-bottom:.6rem; }
    .sec-title { font-size:1.35rem; font-weight:700; color:var(--text-primary); margin-bottom:1.2rem; line-height:1.3; }
    .sec-body  { font-size:.95rem; color:var(--text-secondary); line-height:1.85; max-width:720px; }
    .sec-body p { margin:0 0 1rem; }
    .sec-body p:last-child { margin-bottom:0; }

    .callout { background: color-mix(in srgb,var(--project-color) 7%,var(--bg-card));
               border:1px solid color-mix(in srgb,var(--project-color) 25%,var(--border));
               border-left:3px solid var(--project-color); border-radius:8px;
               padding:1rem 1.25rem; font-size:.88rem; line-height:1.75;
               color:var(--text-secondary); margin:1.25rem 0; }
    .callout strong { color:var(--text-primary); }

    /* Module cards */
    .module-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-top:1.5rem; }
    .module-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
                   padding:1.25rem; transition:border-color .2s,box-shadow .2s; }
    .module-card:hover { border-color:var(--project-color); box-shadow:0 0 0 1px color-mix(in srgb,var(--project-color) 20%,transparent); }
    .module-icon { font-size:1.6rem; margin-bottom:.55rem; }
    .module-name { font-weight:700; font-size:.9rem; color:var(--project-color); margin-bottom:.4rem; }
    .module-desc { font-size:.78rem; color:var(--text-secondary); line-height:1.65; }

    /* Steps */
    .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-top:1.5rem; }
    .step-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:1.25rem; transition:border-color .2s; }
    .step-card:hover { border-color:var(--project-color); }
    .step-num { font-family:'JetBrains Mono',monospace; font-size:1.8rem; font-weight:700;
                color:var(--project-color); opacity:.28; line-height:1; margin-bottom:.65rem; }
    .step-icon { font-size:1.4rem; margin-bottom:.55rem; }
    .step-title {
